name: Android
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.variant.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - name: Select build provenance
        id: variant
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          TAG: ${{ github.ref_name }}
        run: |
          variant=Master
          channel=none
          version=1.0
          if [[ "$EVENT" == push && "$REF" == refs/tags/v* ]]; then
            [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+){1,3}$ ]] || { echo 'Expected a numeric version tag, e.g. v1.2.3'; exit 1; }
            variant=Versioned
            channel=github-release
            version="${TAG#v}"
          elif [[ "$EVENT" == push && "$REF" == refs/heads/master ]]; then
            channel=github-master
          fi
          echo "variant=$variant" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build and lint
        env:
          VARIANT: ${{ steps.variant.outputs.variant }}
          CHANNEL: ${{ steps.variant.outputs.channel }}
          VERSION: ${{ steps.variant.outputs.version }}
        run: ./gradlew "assemble$VARIANT" "lint$VARIANT" -PmasterBuildNumber="$GITHUB_RUN_NUMBER" -PappVersion="$VERSION" -PupdateChannel="$CHANNEL" -PupdateRepository="$GITHUB_REPOSITORY"
      - name: Verify and package universal APK
        env:
          VARIANT: ${{ steps.variant.outputs.variant }}
          CHANNEL: ${{ steps.variant.outputs.channel }}
          VERSION: ${{ steps.variant.outputs.version }}
        run: |
          variant="${VARIANT,,}"
          apk="app/build/outputs/apk/$variant/app-$variant.apk"
          ./scripts/verify-universal-apk.sh "$apk"
          mkdir -p dist
          name=aarchive-master-universal.apk
          version_name="$VERSION-master.$GITHUB_RUN_NUMBER"
          if [[ "$CHANNEL" == github-release ]]; then
            name=aarchive-universal.apk
            version_name="$VERSION"
          fi
          cp "$apk" "dist/$name"
          if [[ "$CHANNEL" != none ]]; then
            python3 scripts/make-update-metadata.py "dist/$name" --channel "$CHANNEL" --repository "$GITHUB_REPOSITORY" --version-code "$GITHUB_RUN_NUMBER" --version-name "$version_name"
          fi
          cd dist
          sha256sum "$name" > "$name.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: aarchive-universal
          path: dist/*
          if-no-files-found: error
  native-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build zlib1g-dev python3 \
            libarchive-tools zip zstd lz4 brotli ncompress liblzo2-2
      - run: ./tests/run-host-tests.sh
      - run: ./tests/run-update-policy-tests.sh
      - name: Test release publication
        run: python3 tests/test-master-release.py

  master-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [build, native-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aarchive-universal
          path: dist
      - name: Publish rolling master prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-master-release.sh dist

  versioned-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, native-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aarchive-universal
          path: dist
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-versioned-release.sh dist
