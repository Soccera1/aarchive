name: Android
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - name: Build and lint
        run: ./gradlew assembleMaster lintMaster -PmasterBuildNumber="$GITHUB_RUN_NUMBER"
      - name: Verify and package universal APK
        run: |
          ./scripts/verify-universal-apk.sh app/build/outputs/apk/master/app-master.apk
          mkdir -p dist
          cp app/build/outputs/apk/master/app-master.apk dist/aarchive-master-universal.apk
          cd dist
          sha256sum aarchive-master-universal.apk > aarchive-master-universal.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: aarchive-master-universal
          path: dist/*
          if-no-files-found: error
  native-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build zlib1g-dev python3 \
            libarchive-tools zip zstd lz4 brotli ncompress liblzo2-2
      - run: ./tests/run-host-tests.sh
      - name: Test rolling release publication
        run: python3 tests/test-master-release.py

  master-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [build, native-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aarchive-master-universal
          path: dist
      - name: Publish rolling master prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-master-release.sh dist
